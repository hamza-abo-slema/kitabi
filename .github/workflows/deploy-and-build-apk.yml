name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via PWABuilder Cloud API
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Sending build request for: $URL"

          # Try PWABuilder API endpoints
          curl -sf -X POST "https://pwabuilder.com/api/build" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$URL\"}" \
            -o build-result.zip 2>&1 && echo "API 1 succeeded" || \
          curl -sf -X POST "https://api.pwabuilder.com/v1/build" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$URL\"}" \
            -o build-result.zip 2>&1 && echo "API 2 succeeded" || \
          curl -sf "https://pwabuilder.com/api/build?url=${URL}" \
            -o build-result.zip 2>&1 && echo "API 3 succeeded" || \
          echo "All APIs failed"

          if [ -f "build-result.zip" ] && [ -s "build-result.zip" ]; then
            mkdir -p final-apk
            unzip -o build-result.zip -d final-apk/ 2>/dev/null || true
            find final-apk -name "*.apk" -exec mv {} final-apk/ \; 2>/dev/null
            ls -la final-apk/ 2>/dev/null
          else
            echo "No build result from APIs"
            mkdir -p final-apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: final-apk/


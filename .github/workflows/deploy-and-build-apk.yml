name: Deploy Pages & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get deployed URL
        id: url
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Install @pwabuilder/cli
        run: npm install -g @pwabuilder/cli

      - name: Build APK
        run: |
          mkdir -p final-apk
          npx pwabuilder build "${{ steps.url.outputs.url }}" \
            --android \
            --output final-apk 2>&1
          echo "--- Build output ---"
          find . -name "*.apk" -type f 2>/dev/null
          find . -name "*.aab" -type f 2>/dev/null
          find . -name "*.apks" -type f 2>/dev/null
          ls -la final-apk/ 2>/dev/null || echo "Directory empty"
          find . -type d -name "android" -o -type d -name "apk" 2>/dev/null

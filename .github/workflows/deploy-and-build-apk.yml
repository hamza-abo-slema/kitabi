name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Create Android project
        run: |
          URL="${{ steps.url.outputs.url }}"
          mkdir -p android/app/src/main/java/com/kitabi/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/gradle/wrapper

          cat > android/settings.gradle << 'EOF'
          rootProject.name = 'Kitabi'
          include ':app'
          EOF

          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google() mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google() mavenCentral() } }
          EOF

          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kitabi.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.kitabi.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Kitabi" android:supportsRtl="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > android/app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowBackground">#0d1117</item></style></resources>
          XML

          cat > android/app/src/main/java/com/kitabi/app/MainActivity.java << JAVA
          package com.kitabi.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = new WebView(this);
              setContentView(wv);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("$URL");
            }
          }
          JAVA

      - name: Setup & Build APK
        run: |
          # Check Android SDK
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools"

          # Install SDK components if needed
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
            [ ! -f "$SDKMANAGER" ] && SDKMANAGER=$ANDROID_HOME/tools/bin/sdkmanager
            if [ -f "$SDKMANAGER" ]; then
              echo yes | $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" 2>&1
            fi
          fi

          # Download Gradle and use it directly (avoid wrapper bootstrap)
          curl -sLo gradle-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-bin.zip
          GRADLE_HOME=$PWD/gradle-8.2

          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "=== Building APK ==="
          $GRADLE_HOME/bin/gradle assembleRelease --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: android/app/build/outputs/apk/release/*.apk

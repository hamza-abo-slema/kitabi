name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Generate APK via Bubblewrap Docker
        run: |
          URL="${{ steps.url.outputs.url }}"
          mkdir -p output
          docker run --rm -v $PWD/output:/output \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            sh -c "
              mkdir -p /project && cd /project
              npx @pwabuilder/bubblewrap init \
                --manifest '${URL}/manifest.json' \
                --appVersionName '1.0' \
                --appVersionCode 1 \
                --directory .
              npx @pwabuilder/bubblewrap build --skipSigning
              find . -name '*.apk' -exec cp {} /output/ \;
            " 2>&1 || echo "Docker build failed, trying alternative..."
          ls -la output/ 2>/dev/null || echo "No output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: output/

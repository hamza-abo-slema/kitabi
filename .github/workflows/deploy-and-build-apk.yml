name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Build APK via PWABuilder CLI
        run: |
          URL="${{ steps.url.outputs.url }}"
          echo "Building APK for: $URL"
          
          npm install -g @pwabuilder/cli 2>&1
          mkdir -p output
          
          npx pwabuilder build "$URL" --android --output output 2>&1 || \
          npx @pwabuilder/cli build "$URL" --android --output output 2>&1 || \
          echo "Both build attempts completed"

          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          find output -type f 2>/dev/null
          ls -laR output/ 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: output/

name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm i -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          URL="${{ steps.url.outputs.url }}"
          MANIFEST="${URL}/manifest.json"
          mkdir -p twa-project
          cd twa-project
          bubblewrap init \
            --manifest="$MANIFEST" \
            --appVersionName="1.0" \
            --appVersionCode=1 \
            --directory=. 2>&1 || \
          npx @bubblewrap/cli init \
            --manifest="$MANIFEST" \
            --appVersionName="1.0" \
            --appVersionCode=1 2>&1

      - name: Build APK
        run: |
          cd twa-project || exit 1
          ls -la
          bubblewrap build --skipSigning 2>&1 || \
          npx @bubblewrap/cli build --skipSigning 2>&1
          mkdir -p ../final-apk
          find . -name "*.apk" -exec cp {} ../final-apk/ \; 2>/dev/null
          ls -la ../final-apk/ 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: final-apk/


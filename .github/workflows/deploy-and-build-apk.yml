name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Create Android project files
        run: |
          URL="${{ steps.url.outputs.url }}"
          mkdir -p MyApp/app/src/main/java/com/kitabi/app
          mkdir -p MyApp/app/src/main/res/values

          cat > MyApp/settings.gradle << 'EOF'
          rootProject.name = 'Kitabi'
          include ':app'
          EOF

          cat > MyApp/build.gradle << 'EOF'
          buildscript {
            repositories { google() mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google() mavenCentral() } }
          EOF

          cat > MyApp/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > MyApp/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kitabi.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.kitabi.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > MyApp/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Kitabi" android:supportsRtl="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > MyApp/app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:windowBackground">#0d1117</item></style></resources>
          XML

          cat > MyApp/app/src/main/java/com/kitabi/app/MainActivity.java << JAVA
          package com.kitabi.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = new WebView(this);
              setContentView(wv);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("URL_HERE");
            }
          }
          JAVA
          sed -i "s|URL_HERE|$URL|g" MyApp/app/src/main/java/com/kitabi/app/MainActivity.java

      - name: Build APK in Android Build Box
        run: |
          mkdir -p output
          docker run --rm \
            -v $PWD/MyApp:/project \
            -v $PWD/output:/output \
            ghcr.io/pwa-builder/android-build-box:latest \
            bash -c '
              cd /project
              echo "sdk.dir=/android/sdk" > local.properties
              # Generate gradle wrapper
              cd /project
              gradle wrapper --gradle-version 8.2 2>&1
              chmod +x gradlew
              # Build release APK
              ANDROID_HOME=/android/sdk ./gradlew assembleRelease 2>&1
              # Find APK
              find /project -name "*.apk" -exec cp {} /output/ \; 2>/dev/null
              echo "Done building"
            ' 2>&1 || echo "Build failed"

          echo "=== Output ==="
          ls -la output/ 2>/dev/null || echo "No output"

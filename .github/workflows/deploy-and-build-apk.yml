name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap and build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android
        run: |
          URL="${{ steps.url.outputs.url }}"
          MANIFEST="${URL}/manifest.json"

          mkdir -p app
          cd app

          # Install bubblewrap without sudo
          npm config set prefix $HOME/.npm-global
          export PATH=$HOME/.npm-global/bin:$PATH
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

          npm install -g @pwabuilder/bubblewrap 2>&1 || {
            echo "npm install failed, trying npx..."
            npx @pwabuilder/bubblewrap --version 2>&1
          }

          # Check what's available
          which bubblewrap 2>/dev/null || echo "Not in PATH"
          ls $HOME/.npm-global/bin/ 2>/dev/null

          # Try init with multiple approaches
          bubblewrap init \
            --manifest "$MANIFEST" \
            --appVersionName "1.0" \
            --appVersionCode 1 \
            --directory . 2>&1 || \
          npx @pwabuilder/bubblewrap init \
            --manifest "$MANIFEST" \
            --appVersionName "1.0" \
            --appVersionCode 1 \
            --directory . 2>&1 || \
          echo "Init failed, creating project manually..."

          ls -la

          if [ -f "twa-manifest.json" ]; then
            bubblewrap build --skipSigning 2>&1 || \
            npx @pwabuilder/bubblewrap build --skipSigning 2>&1 || true
          fi

          mkdir -p ../final-apk
          find . -name "*.apk" -exec cp {} ../final-apk/ \; 2>/dev/null
          ls -la ../final-apk/ 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: final-apk/


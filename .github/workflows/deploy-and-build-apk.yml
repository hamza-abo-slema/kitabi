name: Deploy & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Get deployed URL
        id: url
        run: |
          echo "url=https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/ 2>/dev/null || echo "No ANDROID_HOME"
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "No default SDK path"
          # Check available build-tools
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "No build-tools"
          ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null || echo "No platforms"

      - name: Create Android project
        run: |
          URL="${{ steps.url.outputs.url }}"
          ANDROID_SDK="/usr/local/lib/android/sdk"
          BUILD_TOOLS_VER=$(ls $ANDROID_SDK/build-tools/ 2>/dev/null | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS_VER"

          mkdir -p MyApp/app/src/main/java/com/kitabi/app
          mkdir -p MyApp/app/src/main/res/values
          mkdir -p MyApp/gradle/wrapper

          # settings.gradle
          cat > MyApp/settings.gradle << 'EOF'
          rootProject.name = 'Kitabi'
          include ':app'
          EOF

          # root build.gradle
          cat > MyApp/build.gradle << 'EOF'
          buildscript {
            repositories { google() mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google() mavenCentral() } }
          EOF

          # gradle.properties
          cat > MyApp/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # local.properties
          echo "sdk.dir=${ANDROID_SDK}" > MyApp/local.properties

          # app/build.gradle
          cat > MyApp/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kitabi.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.kitabi.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release { minifyEnabled false }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat > MyApp/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Kitabi" android:supportsRtl="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          # styles.xml
          cat > MyApp/app/src/main/res/values/styles.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:windowBackground">#0d1117</item>
            </style>
          </resources>
          XML

          # MainActivity.java
          cat > MyApp/app/src/main/java/com/kitabi/app/MainActivity.java << 'JAVA'
          package com.kitabi.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = new WebView(this);
              setContentView(wv);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.loadUrl("URL_HERE");
            }
          }
          JAVA
          sed -i "s|URL_HERE|$URL|g" MyApp/app/src/main/java/com/kitabi/app/MainActivity.java

      - name: Build APK with Gradle
        run: |
          cd MyApp
          # Download and use gradle directly
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip
          GRADLE_HOME=$(pwd)/gradle-8.2
          export PATH=$GRADLE_HOME/bin:$PATH
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "SDK: $ANDROID_HOME"
          gradle assembleRelease --no-daemon 2>&1

          mkdir -p ../final-apk
          find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} ../final-apk/ \;
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../final-apk/ 2>/dev/null || true
          ls -la ../final-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: final-apk/


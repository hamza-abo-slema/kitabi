name: Deploy Pages & Build APK

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get deployed URL
        id: url
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build Android package
        run: |
          mkdir -p apk-output
          npx pwabuilder build \
            --url "${{ steps.url.outputs.url }}" \
            --android \
            --output apk-output 2>&1 || true
          find . -name "*.apk" -o -name "*.aab" -o -name "*.apks" 2>/dev/null | head -20

      - name: Locate and upload APK
        run: |
          mkdir -p final-apk
          found=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            found=$(find . -name "*.aab" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$found" ]; then
            echo "Found: $found"
            cp "$found" final-apk/
          else
            echo "No APK found - check build output"
            ls -la apk-output/ 2>/dev/null || echo "apk-output empty"
            find . -type d -maxdepth 3 2>/dev/null
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk
          path: final-apk/

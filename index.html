<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
    <title>كتابي - مشغل كتاب صوتي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>&#x1F4DA; كتابي - مشغل الكتاب الصوتي</h1>
    <div class="track-info">
      <div id="track-name">-</div>
      <div id="dur">0:00</div>
    </div>
    <div id="loading">جاري تحميل الملف الصوتي...</div>
    <progress id="progress" value="0" max="100"></progress>
    <div id="time">0:00 / 0:00</div>
    <div id="controls">
      <button id="play-btn" class="btn btn-primary">&#x25B6; Play</button>
      <button id="stop-btn" class="btn">&#x25A0; Stop</button>
    </div>
    <div class="toggle-row">
      <label class="toggle-label">
        <input type="checkbox" id="phase-toggle" checked>
        <span class="toggle-slider"></span>
        &#x1F6E1; حماية عكس الطور (Phase Inversion)
      </label>
    </div>
    <span id="status-badge" class="badge badge-success">&#x2705; حماية عكس الطور نشطة</span>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script src="js/audio-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

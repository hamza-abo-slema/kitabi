<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AudioShield - مشغل صوتي آمن</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>AudioShield &#x1F6E1;</h1>
    <div class="track-info">
      <div id="track-name">-</div>
      <div id="dur">0:00</div>
    </div>
    <div id="loading">جاري تحميل الملف الصوتي...</div>
    <progress id="progress" value="0" max="100"></progress>
    <div id="time">0:00 / 0:00</div>
    <div id="controls">
      <button id="play-btn" class="btn btn-primary">&#x25B6; Play</button>
      <button id="stop-btn" class="btn">&#x25A0; Stop</button>
    </div>
    <span id="status-badge" class="badge badge-success">&#x2705; Normal Playback</span>
    <div class="test-note">
      <button id="test-btn" class="btn btn-sm btn-danger">&#x1F6A8; Test Anti-Recording</button>
      <div style="margin-top:6px">اختبر إلغاء الصوت عند التسجيل يدويًا</div>
    </div>
    <div class="log-label">&#x1F4DD; Event Log</div>
    <div id="log">[system] AudioShield initialized<br></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script src="js/audio-engine.js"></script>
  <script src="js/recorder-detector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
